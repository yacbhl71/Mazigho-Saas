name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag ou branche à déployer"
        required: true
        default: "main"
        type: string
      migrate:
        description: "Autoriser le bootstrap des migrations au démarrage"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  REGION: europe-west1
  SERVICE: mazigho-saas-git
  PROJECT_ID: gen-lang-client-0773264598

jobs:
  deploy:
    name: Build and deploy Cloud Run
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy exact checked-out source to Cloud Run
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          set -euo pipefail
          test -n "${GITHUB_SHA}"
          echo "Deploying ${GITHUB_SHA} to ${SERVICE} in ${REGION}"
          gcloud run deploy "${SERVICE}" \
            --source . \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --quiet

      - name: Verify deployed service
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='yaml(status.latestReadyRevisionName,status.traffic,status.url)'
